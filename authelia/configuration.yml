server:
  address: 'tcp://:9091/'
  endpoints:
    authz:
      auth-request:
        implementation: 'AuthRequest'

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    - domain: ['auth.bourg.local', 'cloud.bourg.local']
      policy: bypass
    - domain: www.bourg.local
      resources: ['^/api([/?].*)?$']
      policy: one_factor
    - domain: ['www.bourg.local', 'bourg.local']
      policy: bypass

session:
  cookies:
    - domain: bourg.local
      authelia_url: https://auth.bourg.local
      default_redirection_url: https://www.bourg.local

storage:
  postgres:
    address: 'tcp://postgres:5432'
    database: authelia
    username: authelia

notifier:
  filesystem:
    filename: /config/notification.txt