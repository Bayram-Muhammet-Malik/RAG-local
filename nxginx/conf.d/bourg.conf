server_tokens off;

ssl_certificate     /etc/nginx/certs/bourg.local.pem;
ssl_certificate_key /etc/nginx/certs/bourg.local-key.pem;
ssl_protocols TLSv1.2 TLSv1.3;

# HTTP -> HTTPS
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Site statique + API IA
server {
    listen 443 ssl;
    http2 on;
    server_name www.bourg.local bourg.local;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri $uri/ =404; }

    location = /internal/authelia {
        internal;
        proxy_pass http://authelia:9091/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-URI $request_uri;
    }

    location /api/ {
        auth_request /internal/authelia;
        auth_request_set $user $upstream_http_remote_user;
        error_page 401 =302 https://auth.bourg.local/?rd=$scheme://$http_host$request_uri;

        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header Remote-User $user;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# Authelia
server {
    listen 443 ssl;
    http2 on;
    server_name auth.bourg.local;

    location / {
        proxy_pass http://authelia:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

# Nextcloud (FPM)
upstream php-handler { server nextcloud:9000; }

server {
    listen 443 ssl;
    listen 8080;
    http2 on;
    server_name cloud.bourg.local;

    root /var/www/html;
    index index.php;
    client_max_body_size 10G;
    fastcgi_buffers 64 4K;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    fastcgi_hide_header X-Powered-By;

    location = /.well-known/carddav { return 301 /remote.php/dav/; }
    location = /.well-known/caldav  { return 301 /remote.php/dav/; }
    location ^~ /.well-known        { return 301 /index.php$request_uri; }

    location / { rewrite ^ /index.php; }

    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)/ { deny all; }
    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console)          { deny all; }

    location ~ \.php(?:$|/) {
        rewrite ^/(?!index|remote|public|cron|core/ajax/update|status|ocs/v[12]|updater/.+) /index.php$request_uri;
        fastcgi_split_path_info ^(.+?\.php)(/.*|)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;
        fastcgi_pass php-handler;
        fastcgi_request_buffering off;
        fastcgi_read_timeout 3600s;
    }

    location ~ \.(?:css|js|mjs|svg|gif|ico|jpg|png|webp|wasm|map|otf|woff2?)$ {
        try_files $uri /index.php$request_uri;
        expires 7d;
        access_log off;
    }
}